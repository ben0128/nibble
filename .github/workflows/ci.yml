# CI — 兩份實作各自綠，共同向量（docs/fixtures/）兩邊都跑。
#
# 這補上「本機沒有 Windows」的缺口：windows job 在真的 Windows 上跑 nibble-core
# 的全部測試（含原子寫入語意）並「真的連結」出 m0-probe.exe——比本機的
# cargo check 多一層。硬體路徑仍然只有 Ben 的 VM 能驗（M0 閘門）。
#
# mutation 審計（Tests/mutate.py 與 Rust 探針）刻意不進 CI：那是「改測試時
# 證明測試會叫」的本地工具，每次 push 跑 76 個變異體太重也沒有意義。
name: ci
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-macos:
    name: "macOS: make test (Swift + fixtures)"
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: make test

  rust-linux:
    name: "Linux: nibble-core vs fixtures, clippy, fmt"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --workspace
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo fmt --check

  rust-windows:
    name: "Windows: nibble-core + probe links for real"
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --workspace
      - run: cargo build --release --workspace
      - name: sizes — the size claim gets measured, never assumed
        run: Get-ChildItem target/release/*.exe | Format-List Name, Length
      # 無裝置路徑的「真執行」煙霧測試：runner 上沒有羅技裝置，
      # 所以 doctor 必須 exit 1、transports 必須 fail 得誠實、version 必須 exit 0。
      # 這是本機（macOS）給不了的驗證層——exit codes 和 JSON 形狀在真 Windows 上鎖定。
      - name: smoke — version exits 0
        shell: pwsh
        run: |
          ./target/release/nibble.exe version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $v = ./target/release/nibble.exe version --json | ConvertFrom-Json
          if (-not $v.version) { Write-Error "version --json missing key"; exit 1 }
      - name: smoke — help exits 0, unknown command exits 64
        shell: pwsh
        run: |
          # 不能用 Select-Object -First 1 或 > $null：前者提前終止管線把程序殺在半路、
          # 後者在 dot-sourced script 裡不設 $LASTEXITCODE——Out-Null 是唯一誠實的消耗法
          ./target/release/nibble.exe help | Out-Null
          $h = $LASTEXITCODE
          ./target/release/nibble.exe nosuchcommand | Out-Null
          $u = $LASTEXITCODE
          Write-Host "help=$h unknown=$u"
          if ($h -ne 0) { Write-Host "::error::help should exit 0, got $h"; exit 1 }
          if ($u -ne 64) { Write-Host "::error::unknown command should exit 64, got $u"; exit 1 }
          exit 0
      - name: smoke — doctor reports the truth on a mouseless runner
        shell: pwsh
        run: |
          $env:NIBBLE_CONFIG = "$env:TEMP\nibble-ci.json"
          $d = ./target/release/nibble.exe doctor --json | ConvertFrom-Json
          if ($LASTEXITCODE -ne 1) { Write-Host "::error::doctor should exit 1 with no device, got $LASTEXITCODE"; exit 1 }
          if ($d.ok) { Write-Host "::error::doctor claims ok on a runner with no Logitech device"; exit 1 }
          if (-not ($d.checks | Where-Object { $_.check -eq "transports" -and $_.status -eq "fail" })) {
            Write-Host "::error::transports check should fail honestly"; exit 1 }
          # GH 的 pwsh wrapper 以 exit $LASTEXITCODE 收尾——doctor 正確的 exit 1 會被轉發成
          # 步驟失敗，所以斷言全過之後要顯式歸零
          exit 0
      - name: smoke — battery fails with the documented error shape
        shell: pwsh
        run: |
          $b = ./target/release/nibble.exe battery --json | ConvertFrom-Json
          if ($LASTEXITCODE -ne 2) { Write-Host "::error::battery should exit 2 with no transport, got $LASTEXITCODE"; exit 1 }
          if (-not $b.error -or -not $b.code) { Write-Host "::error::error JSON missing error/code keys"; exit 1 }
          exit 0
      # M0 的免工具鏈路徑：VM 直接從 Actions 下載 exe 跑（x64 在 Win11 ARM 模擬層執行，
      # 順便驗掉 spec §8 那條風險）。CLI+tray 也一起上傳——M0 過閘後 VM 內第一時間可實測。
      - uses: actions/upload-artifact@v4
        with:
          name: m0-probe-x64
          path: windows/target/release/m0-probe.exe
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: nibble-win-x64
          path: |
            windows/target/release/nibble.exe
            windows/target/release/nibble-tray.exe
          retention-days: 30
