# Release — push 一個 v* tag 就把「build universal app → GitHub Release → bump tap」
# 整串跑完。ci.yml 管測試；這裡只管發佈。
#
# 需要的 secret：TAP_PUSH_TOKEN（fine-grained PAT，homebrew-nibble 的 Contents 寫入權）。
# 沒設的話 tap bump 會跳過並在 log 印出 sha256 供手動更新，release 本身照樣完成。
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build universal Nibble.app
        run: |
          make universal
          make app
          ARCHS=$(lipo -archs Nibble.app/Contents/MacOS/nibble)
          echo "archs: $ARCHS"
          echo "$ARCHS" | grep -q arm64  || { echo "::error::missing arm64 slice"; exit 1; }
          echo "$ARCHS" | grep -q x86_64 || { echo "::error::missing x86_64 slice"; exit 1; }

      - name: Package
        id: pkg
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ZIP="Nibble-${VERSION}.zip"
          ditto -c -k --keepParent Nibble.app "$ZIP"
          {
            echo "version=${VERSION}"
            echo "zip=${ZIP}"
            echo "zip_sha=$(shasum -a 256 "$ZIP" | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"

      - name: Create release and upload asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" "${{ steps.pkg.outputs.zip }}" --clobber

      - name: Bump tap (formula + cask), sync Formula copy back
        env:
          TAP_TOKEN: ${{ secrets.TAP_PUSH_TOKEN }}
          VERSION: ${{ steps.pkg.outputs.version }}
          ZIP_SHA: ${{ steps.pkg.outputs.zip_sha }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::TAP_PUSH_TOKEN not set — skipping tap bump. zip sha256: ${ZIP_SHA}"
            exit 0
          fi
          SRC_SHA=$(curl -sL "https://github.com/ben0128/nibble/archive/refs/tags/v${VERSION}.tar.gz" | shasum -a 256 | cut -d' ' -f1)
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/ben0128/homebrew-nibble.git" tap-checkout
          cd tap-checkout
          sed -i '' -E "s|refs/tags/v[0-9.]+\.tar\.gz|refs/tags/v${VERSION}.tar.gz|" Formula/nibble.rb
          sed -i '' -E "s|^  sha256 \".*\"|  sha256 \"${SRC_SHA}\"|" Formula/nibble.rb
          sed -i '' -E "s|^  version \".*\"|  version \"${VERSION}\"|" Casks/nibble.rb
          sed -i '' -E "s|^  sha256 \".*\"|  sha256 \"${ZIP_SHA}\"|" Casks/nibble.rb
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "nibble ${VERSION} (formula + cask)"
          git push
          # Formula/ 在主 repo 有一份人工同步的副本——這裡順手對齊，省一次手動同步
          cd "$GITHUB_WORKSPACE"
          git fetch origin main
          git checkout main
          cp tap-checkout/Formula/nibble.rb Formula/nibble.rb
          if ! git diff --quiet Formula/nibble.rb; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "Formula: sync from tap for v${VERSION} [skip ci]" Formula/nibble.rb
            git push origin main
          fi
